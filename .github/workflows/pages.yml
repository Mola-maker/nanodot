name: Documentation checks (legacy Pages publishing closed)
# nanoMuse: product publishing belongs to the protected manual gateway workflow.
on:
  pull_request:
    paths: ['docs/**', 'website/**', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'website/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Public registry lockfile only
        run: |
          node -e 'for(const entry of Object.values(require("./website/package-lock.json").packages)){if(entry.resolved&&!entry.resolved.startsWith("https://registry.npmjs.org/"))throw Error("Nonpublic registry in lockfile");}'
      - run: npm ci --prefix website
      - run: npm --prefix website run docs:build
# No GitHub Pages upload/deploy job or publication permissions.
