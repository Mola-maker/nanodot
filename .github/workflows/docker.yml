name: Docker image

# Builds Nanodot for linux/amd64 and linux/arm64; publication is an explicit manual input.
#   main            -> :edge
#   tag vX.Y.Z      -> :X.Y.Z, :X.Y, :latest
# Pull requests build the amd64 image without pushing (the CI workflow smoke-tests it).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images to this repository owner on GHCR"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.repository == 'Mola-maker/nanodot' && github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanodot
          # metadata-action normalizes GHCR image names to lower-case
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Nanodot
            org.opencontainers.image.description=Nanodot personal agent with Dot, based on nanoMuse, with memory, goals and approvals. Bring your own model.
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.repository == 'Mola-maker/nanodot' && github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same image with Chromium bundled and the browser tool on: :edge-browser,
      # :X.Y.Z-browser, :latest-browser. amd64 only: Chromium and its libraries under QEMU
      # take far too long to build; on an arm64 box, `docker build --build-arg WITH_BROWSER=1 .`
      # does the same natively.
      - name: Image tags (browser)
        id: meta_browser
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanodot
          flavor: |
            latest=false
            suffix=-browser
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Nanodot (with browser)
            org.opencontainers.image.description=Nanodot with Chromium bundled for the browser tool.
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push (browser)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: WITH_BROWSER=1
          push: ${{ github.repository == 'Mola-maker/nanodot' && github.event_name == 'workflow_dispatch' && inputs.publish }}
          tags: ${{ steps.meta_browser.outputs.tags }}
          labels: ${{ steps.meta_browser.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
