      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#F4F7F8" />
    <script>
      // Follow the system unless a stored choice overrides it: applied
      // before the first paint so a dark choice does not flash white
      try {
        var t = localStorage.getItem("nanomuse_theme") || "system";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#10191D");
      } catch (e) {
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#10191D");
      }
    </script>
